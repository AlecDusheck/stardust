<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stardust</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: black; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    main { flex: 1; min-width: 0; min-height: 0; }
    canvas { display: block; touch-action: none; }
    #controls { display: none; }
    button {
      color: #8cebee; background: #102124; border: 2px solid #376569;
      border-radius: 12px; font: bold 16px monospace; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    button.pressed { background: #24606a; border-color: #8cebee; }
    .dpad { display: grid; grid-template: repeat(3, 48px) / repeat(3, 48px); gap: 3px; }
    .up { grid-area: 1 / 2; }
    .left { grid-area: 2 / 1; }
    .right { grid-area: 2 / 3; }
    .down { grid-area: 3 / 2; }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .utility { display: flex; gap: 8px; }
    .utility button { min-height: 44px; padding: 0 8px; font-size: 12px; }
    .magic { width: 84px; height: 84px; border-radius: 50%; }
    @media (any-pointer: coarse) {
      #controls {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px max(16px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        touch-action: none;
      }
    }
    @media (any-pointer: coarse) and (orientation: landscape) {
      body {
        display: grid; grid-template-columns: 168px minmax(0, 1fr) 144px;
        padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
      }
      main { grid-column: 2; grid-row: 1; }
      #controls { display: contents; }
      .dpad { grid-column: 1; grid-row: 1; align-self: center; justify-self: center; }
      .actions { grid-column: 3; grid-row: 1; align-self: center; justify-self: center; }
    }
  </style>
</head>
<body>
  <main><canvas id="game" tabindex="0" aria-label="Stardust"></canvas></main>
  <nav id="controls" aria-label="Game controls">
    <div class="dpad" aria-label="Movement">
      <button class="up" data-code="ArrowUp" aria-label="Up">▲</button>
      <button class="left" data-code="ArrowLeft" aria-label="Left">◀</button>
      <button class="right" data-code="ArrowRight" aria-label="Right">▶</button>
      <button class="down" data-code="ArrowDown" aria-label="Down">▼</button>
    </div>
    <div class="actions">
      <div class="utility">
        <button data-code="Escape">Menu</button>
        <button data-code="KeyR">Reset</button>
      </div>
      <button class="magic" data-code="Space" aria-label="Magic or start game">Magic</button>
    </div>
  </nav>
  <script type="module">
    import { enableAudio, bindControls } from "./controls.mjs";
    enableAudio(window);
    bindControls(document.querySelector("#controls"), document.querySelector("#game"));
    // wasm-bindgen captures AudioContext when its module loads.
    const { default: init } = await import("./stardust.js");
    await init();
  </script>
</body>
</html>
